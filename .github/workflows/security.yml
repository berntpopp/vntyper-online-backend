# .github/workflows/security.yml
# Security scanning workflow for configuration files and secrets
#
# Runs on: Push to main, PRs, and weekly schedule
# Features:
#   - Trivy config scanning (Dockerfiles, docker-compose, etc.)
#   - Gitleaks secret detection
#   - Results uploaded to GitHub Security tab (SARIF)

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    # Catches new CVEs even without code changes
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual trigger for ad-hoc security checks

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ===========================================================================
  # Trivy Configuration Scan
  # Scans Dockerfiles, docker-compose, and IaC files for misconfigurations
  # ===========================================================================
  trivy-config:
    name: Trivy Config Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner (config mode)
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # 0.34.2
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          # Skip submodules - they have their own CI/CD
          skip-dirs: 'backend,frontend,node_modules,.git'
          # Exit code 0 to allow SARIF upload even with findings
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'trivy-config'
        # Don't fail if upload fails (e.g., on forks)
        continue-on-error: true

  # ===========================================================================
  # Gitleaks Secret Detection
  # Scans repository for accidentally committed secrets
  # ===========================================================================
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history needed for scanning all commits
          fetch-depth: 0

      # gitleaks-action needs a paid license for organisation repos; the
      # MIT-licensed CLI does the same scan. Pinned by version and checksum.
      - name: Run Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  # ===========================================================================
  # Trivy Filesystem Scan
  # Scans for vulnerabilities in lockfiles and dependencies
  # ===========================================================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner (fs mode)
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # 0.34.2
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Skip submodules
          skip-dirs: 'backend,frontend,node_modules,.git'
          exit-code: '0'

      - name: Upload Trivy FS results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'
        continue-on-error: true

# .github/workflows/container-scan.yml
# Container image vulnerability scanning workflow
#
# Builds Docker images and scans them for vulnerabilities using Trivy
# Results are uploaded to GitHub Security tab (SARIF)
#
# Runs on: Push/PR when Dockerfile or context files change

name: Container Scan

on:
  push:
    branches: [main]
    paths:
      - 'proxy/**'
      - 'certbot/**'
  pull_request:
    branches: [main]
    paths:
      - 'proxy/**'
      - 'certbot/**'
  schedule:
    # Weekly scan to catch new CVEs in base images
    - cron: '0 1 * * 0'
  workflow_dispatch:
    # Allow manual trigger

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ===========================================================================
  # Build and Scan Container Images
  # ===========================================================================
  build-and-scan:
    name: Build & Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: proxy
            dockerfile: proxy/Dockerfile
            image: vntyper-proxy
          - context: certbot
            dockerfile: certbot/Dockerfile
            image: vntyper-certbot

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:scan
          # Use GitHub Actions cache for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # 0.34.2
        with:
          image-ref: '${{ matrix.image }}:scan'
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Ignore unfixed vulnerabilities (no patch available)
          ignore-unfixed: true
          # Exit 0 to allow SARIF upload
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v3
        with:
          sarif_file: 'trivy-${{ matrix.image }}-results.sarif'
          category: 'container-${{ matrix.image }}'
        continue-on-error: true

      - name: Run Trivy (table output for PR comments)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # 0.34.2
        with:
          image-ref: '${{ matrix.image }}:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
        # Don't fail the job, just report findings
        continue-on-error: true

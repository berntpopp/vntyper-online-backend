# .github/workflows/lint.yml
# Linting workflow for Dockerfiles, shell scripts, YAML, and GitHub Actions
#
# Runs on: Push to main, PRs targeting main
# Scope: Main repository files only (submodules excluded)

name: Lint

on:
  push:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.sh'
      - 'proxy/**'
      - 'certbot/**'
      - 'docker-compose*.yml'
      - '.github/**'
      - '.hadolint.yaml'
      - '.shellcheckrc'
      - '.yamllint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.sh'
      - 'proxy/**'
      - 'certbot/**'
      - 'docker-compose*.yml'
      - '.github/**'
      - '.hadolint.yaml'
      - '.shellcheckrc'
      - '.yamllint.yml'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Restrict permissions to minimum required (security best practice)
permissions:
  contents: read

jobs:
  # One job, one runner: each linter takes seconds, while every extra job waits
  # minutes for a runner slot on the free plan. `!cancelled()` keeps each linter
  # reporting even when an earlier one fails.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint proxy/Dockerfile
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: proxy/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: Lint certbot/Dockerfile
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: certbot/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: Run ShellCheck
        if: ${{ !cancelled() }}
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: '.'
          # Exclude submodules
          ignore_paths: >-
            backend
            frontend
            node_modules
        env:
          SHELLCHECK_OPTS: --rcfile=.shellcheckrc

      - name: Run yamllint
        if: ${{ !cancelled() }}
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: '.'
          config_file: '.yamllint.yml'
          strict: false

      - name: Run actionlint
        if: ${{ !cancelled() }}
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.0.0
        with:
          fail-on-error: true

      - name: Create dummy env files for validation
        if: ${{ !cancelled() }}
        run: |
          # Create minimal .env.local for docker-compose validation
          cat > .env.local << 'EOF'
          # Dummy env file for CI validation
          ENVIRONMENT=local
          SERVER_NAME=localhost
          CLIENT_MAX_BODY_SIZE=100M
          REDIS_PASSWORD=dummypassword
          REDIS_HOST=redis
          REDIS_PORT=6379
          POSTGRES_PASSWORD=dummypassword
          EOF

          # Create minimal .env.production for docker-compose validation
          cat > .env.production << 'EOF'
          # Dummy env file for CI validation
          ENVIRONMENT=production
          SERVER_NAME=example.com
          CLIENT_MAX_BODY_SIZE=100M
          REDIS_PASSWORD=dummypassword
          REDIS_HOST=redis
          REDIS_PORT=6379
          POSTGRES_PASSWORD=dummypassword
          CERTBOT_EMAIL=test@example.com
          CERTBOT_STAGING=1
          EOF

      - name: Validate docker-compose.yml
        if: ${{ !cancelled() }}
        run: docker compose --env-file .env.local -f docker-compose.yml config --quiet
        env:
          INPUT_VOLUME: /tmp/input
          OUTPUT_VOLUME: /tmp/output
          ENV_FILE: .env.local
          REDIS_PASSWORD: dummypassword
          POSTGRES_PASSWORD: dummypassword

      - name: Validate docker-compose.dev.yml overlay
        if: ${{ !cancelled() }}
        run: |
          docker compose \
            --env-file .env.local \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            config --quiet
        env:
          INPUT_VOLUME: /tmp/input
          OUTPUT_VOLUME: /tmp/output
          ENV_FILE: .env.local
          REDIS_PASSWORD: dummypassword
          POSTGRES_PASSWORD: dummypassword

      - name: Validate docker-compose.prod.yml overlay
        if: ${{ !cancelled() }}
        run: |
          docker compose \
            --env-file .env.production \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            config --quiet
        env:
          INPUT_VOLUME: /tmp/input
          OUTPUT_VOLUME: /tmp/output
          ENV_FILE: .env.production
          REDIS_PASSWORD: dummypassword
          POSTGRES_PASSWORD: dummypassword
